name: pointagepro
description: "PointagePro - QR attendance for company directors"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.30
  mobile_scanner: ^6.0.7
  qr_flutter: ^4.1.0
  fl_chart: ^0.70.2
  pdf: ^3.11.3
  printing: ^5.4.4
  csv: ^6.0.0
  excel: ^4.0.6
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  intl: any
  audioplayers: ^6.1.0
  uuid: ^4.5.1
  path: ^1.9.0
  permission_handler: ^11.4.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700



flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/app_icon_monochrome.png"
  min_sdk_android: 24
